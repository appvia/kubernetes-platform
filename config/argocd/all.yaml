---
## The global configuration for the argocd server
global:
  ## Options for the network policy
  networkPolicy:
    ## Enable the creation of the network policy
    create: true
    ## Deny all ingress traffic by default
    defaultDenyIngress: true

## Configuration for redis high availability
redis-ha:
  ## Enable redis high availability
  enabled: false

## Configuration for the argocd application controller
controller:
  ## Set the number of replicas for the argocd application controller
  replicas: 2
  ## Scraped by annotation-based collectors (for example vmagent) on the
  ## metrics port, which the chart's network policy admits from any namespace
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8082"

## Configuration for the argocd dex server
dex:
  ## Scraped by annotation-based collectors (for example vmagent) on the
  ## metrics port, which the chart's network policy admits from any namespace
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "5558"

## Configuration for the argocd server
server:
  ## Enable autoscaling for the argocd server
  autoscaling:
    enabled: true
    minReplicas: 2
  ## Scraped by annotation-based collectors (for example vmagent) on the
  ## metrics port, which the chart's network policy admits from any namespace
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8083"

## Configuration for the argocd metrics server
metrics:
  ## Enable the argocd metrics server, as it is not needed for this deployment
  enable: true
  ## Service annotations for the argocd metrics service
  service:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8083"

## Configuration for the repo server
repoServer:
  autoscaling:
    enabled: true
    minReplicas: 2
  ## Scraped by annotation-based collectors (for example vmagent) on the
  ## metrics port, which the chart's network policy admits from any namespace
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8084"

## Configuration for the application set controller
applicationSet:
  ## Set the number of replicas for the application set controller
  replicas: 2
  ## Scraped by annotation-based collectors (for example vmagent) on the
  ## metrics port, which the chart's network policy admits from any namespace
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"

## Configuration options for argocd
configs:
  ## Set the timeout for the reconciliation to 180 seconds
  timeout:
    reconciliation: 30s
  ## Specify the admin password for the argocd server - password:
  ## echo -n "admin" | argocd admin initial-password --grpc-web
  ## The password is then hashed using the following command:
  ## echo -n "admin" | argocd admin initial-password --grpc-web | sha256sum
  ## The password is then stored in the secret as a hash
  secret:
    argocdServerAdminPassword: "$2a$10$fDcnV8BQs0kwlCpBnQaGgO8Pm7CLESJEU7DbXit/PIN1jOmlPU6JO"
    argocdServerAdminPasswordMtime: "2025-01-24T19:19:24GMT"

# Configuration for argocd notifications
notifications:
  # Enable the argocd notifications controller
  enabled: true
  ## Scraped by annotation-based collectors (for example vmagent) on the
  ## metrics port, which the chart's network policy admits from any namespace
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9001"
  # COnfiguration for the config map that holds the notification
  # templates and triggers
  cm:
    # Do not create the ConfigMap for notifications, as it will be managed
    # by the tenant repository
    create: false
