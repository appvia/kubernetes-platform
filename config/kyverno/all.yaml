---
# Admission controller configuration
admissionController:
  autoscaling:
    # -- Enable horizontal pod autoscaling
    enabled: true
    # -- Minimum number of pods
    minReplicas: 2
    # -- Maximum number of pods
    maxReplicas: 10
  ## Scraped by annotation-based collectors (for example vmagent) on the
  ## metrics port (--metricsPort=8000)
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"

config:
  # Namespaces excluded from the Kyverno admission webhooks. The resource webhooks
  # are Fail-closed, so if kyverno-svc is ever unavailable nothing in a covered
  # namespace can be scheduled. argocd is excluded so Argo CD can always recover
  # and re-sync Kyverno itself. kyverno-system is added by excludeKyvernoNamespace.
  # NOTE: this list replaces the chart default, so kube-system must be retained.
  webhooks:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - argocd
            - kube-system

# Background controller configuration
backgroundController:
  ## Scraped by annotation-based collectors (for example vmagent) on the
  ## metrics port (--metricsPort=8000)
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"

# Cleanup controller configuration
cleanupController:
  ## Scraped by annotation-based collectors (for example vmagent) on the
  ## metrics port (--metricsPort=8000)
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"

# Reports controller configuration
reportsController:
  ## Scraped by annotation-based collectors (for example vmagent) on the
  ## metrics port (--metricsPort=8000)
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
