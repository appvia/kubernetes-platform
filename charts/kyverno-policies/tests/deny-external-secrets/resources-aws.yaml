---
# rootPrefix=eks, clusterName=dev, secretsPrefix="" in Helm values;
# namespace frontend must not use backend paths
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: good-global
  namespace: frontend
spec:
  secretStoreRef:
    name: secrets-store
    kind: ClusterSecretStore
  data:
    - secretKey: token
      remoteRef:
        key: eks/dev/global/shared-app
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: good-ns-scoped
  namespace: frontend
spec:
  secretStoreRef:
    name: secrets-store
    kind: ClusterSecretStore
  data:
    - secretKey: db
      remoteRef:
        key: eks/dev/frontend/database
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: good-datafrom-extract
  namespace: frontend
spec:
  secretStoreRef:
    name: secrets-store
    kind: ClusterSecretStore
  dataFrom:
    - extract:
        key: eks/dev/global/bundle
---
# Missing the eks root segment — the old <cluster>/<namespace>/... layout is no longer valid
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bad-missing-root-prefix
  namespace: frontend
spec:
  secretStoreRef:
    name: secrets-store
    kind: ClusterSecretStore
  data:
    - secretKey: db
      remoteRef:
        key: dev/frontend/database
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bad-cross-namespace-path
  namespace: frontend
spec:
  secretStoreRef:
    name: secrets-store
    kind: ClusterSecretStore
  data:
    - secretKey: stolen
      remoteRef:
        key: eks/dev/backend/test
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ignored-non-cluster-store
  namespace: frontend
spec:
  secretStoreRef:
    name: other
    kind: SecretStore
  data:
    - secretKey: x
      remoteRef:
        key: arbitrary/path
---
# A different-named ClusterSecretStore (not the platform store) must be ignored
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: good-other-cluster-store
  namespace: frontend
spec:
  secretStoreRef:
    name: custom-cluster-store
    kind: ClusterSecretStore
  data:
    - secretKey: x
      remoteRef:
        key: arbitrary/path
---
# Well-formed path for a *different* namespace — tests pure namespace isolation
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bad-cross-namespace-well-formed
  namespace: backend
spec:
  secretStoreRef:
    name: secrets-store
    kind: ClusterSecretStore
  data:
    - secretKey: stolen
      remoteRef:
        key: eks/dev/frontend/database
---
# dataFrom cross-namespace — same isolation rule must apply to extract.key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bad-datafrom-cross-namespace
  namespace: backend
spec:
  secretStoreRef:
    name: secrets-store
    kind: ClusterSecretStore
  dataFrom:
    - extract:
        key: eks/dev/frontend/bundle
---
# With secretsPrefix empty the trailing "/" is the only segment boundary: namespace
# "front" must not be able to reach the "frontend" subtree via a shared string prefix.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bad-namespace-prefix-collision
  namespace: front
spec:
  secretStoreRef:
    name: secrets-store
    kind: ClusterSecretStore
  data:
    - secretKey: stolen
      remoteRef:
        key: eks/dev/frontend/database
---
# Likewise the cluster segment must be whole: cluster "dev" must not match "dev-staging"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bad-cluster-prefix-collision
  namespace: frontend
spec:
  secretStoreRef:
    name: secrets-store
    kind: ClusterSecretStore
  data:
    - secretKey: stolen
      remoteRef:
        key: eks/dev-staging/frontend/database
---
# Regression: an ExternalSecret with no spec at all must not error the CEL
# expression ("no such key: spec") — there is nothing to validate, so it passes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: good-no-spec
  namespace: frontend
---
# Regression: spec present but secretStoreRef absent — not our store, nothing to check
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: good-no-secret-store-ref
  namespace: frontend
spec:
  refreshInterval: 1h
---
# Regression: secretStoreRef present but kind/name omitted
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: good-partial-secret-store-ref
  namespace: frontend
spec:
  secretStoreRef:
    name: secrets-store
