---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: good-legacy
  namespace: my-namespace
spec:
  secretStoreRef:
    name: tenant-store
    kind: SecretStore
  data:
    - secretKey: password
      remoteRef:
        key: my-namespace/secret-ok
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bad-legacy
  namespace: my-different-namespace
spec:
  secretStoreRef:
    name: tenant-store
    kind: SecretStore
  data:
    - secretKey: password
      remoteRef:
        key: my-namespace/not-allowed
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: good-legacy-datafrom
  namespace: my-namespace
spec:
  secretStoreRef:
    name: tenant-store
    kind: SecretStore
  dataFrom:
    - extract:
        key: my-namespace/bundle
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bad-legacy-datafrom
  namespace: my-namespace
spec:
  secretStoreRef:
    name: tenant-store
    kind: SecretStore
  dataFrom:
    - extract:
        key: other-namespace/bundle
---
# The eks/<cluster>/<namespace>/<secret> layout is only valid when
# useAwsSecretsManagerPaths is on. Under the legacy rule it must be rejected,
# otherwise a non-AWS cluster would silently accept cross-namespace keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bad-legacy-aws-layout
  namespace: my-namespace
spec:
  secretStoreRef:
    name: tenant-store
    kind: SecretStore
  data:
    - secretKey: password
      remoteRef:
        key: eks/dev/my-namespace/database
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bad-legacy-aws-layout-datafrom
  namespace: my-namespace
spec:
  secretStoreRef:
    name: tenant-store
    kind: SecretStore
  dataFrom:
    - extract:
        key: eks/dev/my-namespace/bundle
