---
kustomize:
  ## The features to enable in the tenant cluster
  feature: gateway_api
  category: networking
  description: Gateway API CRDs for ingress and mesh-style routing.
  link: https://gateway-api.sigs.k8s.io/
  ## The path to the kustomize overlay
  path: config/crd
  ## The location of an external kustomize repository (optional)
  repository: https://github.com/kubernetes-sigs/gateway-api
  ## The revision of the external repository (optional)
  revision: v1.5.0

namespace:
  ## Name of the namespace to deploy the application
  name: kube-system
  ## Do not create the namespace
  create: false

## Synchronization options
sync:
  ## Before the AWS Load Balancer Controller, which only checks for the CRDs at startup
  phase: primary
